<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="parent-container" class="container">
      <div id="mode-modal" class="modal hidden">
        <div class="modal-card">
          <h2>Selection Phase</h2>

          <div id="single-options" class="options">
            <h3>Select Your Color</h3>
            
            <div class="color-options">
              <button data-color="WHITE" class="color-btn">White</button>
              <button data-color="BLACK" class="color-btn">Black</button>
              <button data-color="RANDOM" class="color-btn active">
                Random
              </button>
            </div>
          </div>

          <button id="start-game-btn" class="start-btn">Start Game</button>
        </div>
      </div>

      <div id="board"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
